{% extends "base.html" %}

{% block content %}

<div class="container-fluid">

    <h2>🍽 Kitchen Management Dashboard</h2>

    <div class="row mt-4">

        <div class="col-md-4">
            <div class="card shadow-sm">
                <div class="card-body">
                    <h5>Food Categories</h5>
                    <h2>{{ categories }}</h2>
                </div>
            </div>
        </div>

        <div class="col-md-4">
            <div class="card shadow-sm">
                <div class="card-body">
                    <h5>Kitchen Items</h5>
                    <h2>{{ items }}</h2>
                </div>
            </div>
        </div>

        <div class="col-md-4">
            <div class="card shadow-sm">
                <div class="card-body">
                    <h5>Suppliers</h5>
                    <h2>{{ suppliers }}</h2>
                </div>
            </div>
        </div>

    </div>

</div>

{% endblock %}
